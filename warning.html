<html>

    </head>
    <body style="background-color: 122, 185, 230;">
        <img src="Pliki/pionpoziom.png" style="text-align: center; width: 50%;">
        <script>
            function orientacja() {
                if (window.innerHeight <= window.innerWidth) {
                    window.location.replace("index.html");
                }
            }
            orientacja();
            window.addEventListener("resize", orientacja);
        </script>
    </body>
