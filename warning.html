<html>
    <head>
        <meta charset="UTF-8">
        <style>
            body {
                background-color: rgba(122, 185, 230);
            }
        </style>
    </head>
    <body>
        <img src="Pliki/pionpoziom.png" height="50%" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100%; max-height: 100vh; object-fit: contain;">
        <script>
            function orientacja() {
                if (window.innerHeight < window.innerWidth) {
                    window.location.replace("index.html");
                }
            }
            orientacja();
            window.addEventListener("resize", orientacja);
        </script>
    </body>
</html>
